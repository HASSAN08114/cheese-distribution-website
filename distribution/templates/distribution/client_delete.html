{% extends 'distribution/base.html' %}

{% block title %}Delete Client{% endblock %}

{% block content %}
<h2 class="mb-4">Delete Client</h2>

<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete client "{{ client.name }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'client_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
