<div class="modal-header">
    <h5 class="modal-title">Edit Manufacturer</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post" id="editManufacturerForm" action="">
    {% csrf_token %}
    <div class="modal-body">
        {{ form.as_p }}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
    </div>
</form>
<script>
// AJAX submit for manufacturer edit
const form = document.getElementById('editManufacturerForm');
form.onsubmit = function(e) {
    e.preventDefault();
    fetch(window.location.href, {
        method: 'POST',
        headers: {'X-Requested-With': 'XMLHttpRequest'},
        body: new FormData(form)
    })
    .then(response => response.text())
    .then(html => {
        document.getElementById('dynamicEditModalContent').innerHTML = html;
    });
};
</script>
