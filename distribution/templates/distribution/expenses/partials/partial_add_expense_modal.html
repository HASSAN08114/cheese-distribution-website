<div class="modal-header">
    <h5 class="modal-title">Add Expense</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post" action="{% url 'expense_management' %}">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Employee (Optional)</label>
            <select name="employee" id="employee_select" class="form-control">
                <option value="">-- Select an employee --</option>
                {% for employee in employees %}
                <option value="{{ employee.pk }}">{{ employee.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Expense Type</label>
            <select name="expense_type" id="expense_type_select" class="form-control" required>
                <option value="">-- Select type --</option>
                <option value="fuel">Fuel</option>
                <option value="maintenance">Maintenance</option>
                <option value="toll">Toll</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (PKR)</label>
            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Expense Date</label>
            <input type="text" name="expense_date_display" class="form-control js-date-picker" placeholder="DD/MM/YYYY" required>
            <input type="hidden" name="expense_date" id="expense_date">
        </div>
        <div class="mb-3">
            <label class="form-label">Note</label>
            <textarea name="note" class="form-control" rows="3" placeholder="Add any notes about this expense"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Expense</button>
    </div>
</form>

<script>
// Handle expense date conversion before form submission
document.addEventListener('DOMContentLoaded', function() {
    const expenseForm = document.querySelector('.modal form[action*="expense_management"]');
    if (!expenseForm) return;
    
    expenseForm.addEventListener('submit', function(e) {
        const displayInput = document.querySelector('input[name="expense_date_display"]');
        const hiddenInput = document.querySelector('input[name="expense_date"]');
        
        if (displayInput && displayInput.value) {
            // Convert DD/MM/YYYY to YYYY-MM-DD
            const parts = displayInput.value.split('/');
            if (parts.length === 3) {
                hiddenInput.value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
        }
    });
});
</script>
