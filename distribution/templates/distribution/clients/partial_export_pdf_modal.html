<!-- Modal for selecting time period for PDF export -->
<div class="modal fade" id="exportPdfModal" tabindex="-1" aria-labelledby="exportPdfModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exportPdfModalLabel">Select Time Period for Report</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="exportPdfForm">
          <div class="mb-3">
            <label for="startDate" class="form-label">Start Date</label>
            <input type="text" class="form-control js-date-picker" id="startDate" name="start_date" placeholder="DD/MM/YYYY">
          </div>
          <div class="mb-3">
            <label for="endDate" class="form-label">End Date</label>
            <input type="text" class="form-control js-date-picker" id="endDate" name="end_date" placeholder="DD/MM/YYYY">
          </div>
          <input type="hidden" id="exportClientId" name="client_id">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="exportPdfSubmit">Export PDF</button>
      </div>
    </div>
  </div>
</div>

<script>
// Open modal and set client id
function openExportPdfModal(clientId) {
  document.getElementById('exportClientId').value = clientId;
  document.getElementById('startDate').value = '';
  document.getElementById('endDate').value = '';
  var modal = new bootstrap.Modal(document.getElementById('exportPdfModal'));
  modal.show();
}

// Handle export button click
function handleExportPdf() {
  const clientId = document.getElementById('exportClientId').value;
  const startDateStr = document.getElementById('startDate').value;
  const endDateStr = document.getElementById('endDate').value;
  
  // Helper function to convert DD/MM/YYYY to YYYY-MM-DD
  function convertDdMmToYyyMmDd(dateStr) {
    if (!dateStr) return '';
    const parts = dateStr.split('/');
    if (parts.length === 3) {
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    return dateStr;
  }
  
  const startDate = convertDdMmToYyyMmDd(startDateStr);
  const endDate = convertDdMmToYyyMmDd(endDateStr);
  
  let url = `/clients/${clientId}/export-pdf/`;
  const params = [];
  if (startDate) params.push(`start_date=${startDate}`);
  if (endDate) params.push(`end_date=${endDate}`);
  if (params.length > 0) url += '?' + params.join('&');
  window.location.href = url;
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('exportPdfSubmit').addEventListener('click', handleExportPdf);
});
</script>
