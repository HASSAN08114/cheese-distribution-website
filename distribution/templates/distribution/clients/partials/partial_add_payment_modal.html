<div class="modal-header">
    <h5 class="modal-title">Add Payment</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form method="post" action="{% url 'add_payment' %}">
    {% csrf_token %}
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Client</label>
            <select name="client" id="client_select" class="form-control" required>
                <option value="">-- Select a client --</option>
                {% for client in clients %}
                <option value="{{ client.pk }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (PKR)</label>
            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Mode</label>
            <select name="mode" id="mode_select" class="form-control" required>
                <option value="">-- Select mode --</option>
                <option value="cash">Cash</option>
                <option value="online">Online</option>
            </select>
        </div>
        <div id="bank-field" class="mb-3 hidden-element">
            <label class="form-label">Bank/Wallet (for online payments)</label>
            <input type="text" name="bank" class="form-control" placeholder="e.g., HBL, JazzCash, etc.">
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Payment</button>
    </div>
</form>
<script>
document.getElementById('mode_select').addEventListener('change', function() {
    document.getElementById('bank-field').style.display = this.value === 'online' ? 'block' : 'none';
});
</script>
