<form id="quickPaymentForm" method="post" action="{% url 'add_payment' %}">
    {% csrf_token %}
    <input type="hidden" name="print_receipt" id="quickPaymentPrintReceipt" value="0">
    <div class="modal-header">
        <h5 class="modal-title">Create Quick Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Client</label>
            <select name="client" id="client_select" class="form-control" required>
                <option value="">-- Select a client --</option>
                {% for client in clients %}
                <option value="{{ client.pk }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (PKR)</label>
            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Date & Time</label>
            <input type="text" name="date_display" id="quick_payment_date" class="form-control js-datetime-picker" placeholder="DD/MM/YYYY HH:MM" required>
            <input type="hidden" name="date" id="quick_payment_date_hidden">
            <small class="text-muted">Defaults to current date and time.</small>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Mode</label>
            <select name="mode" id="mode_select" class="form-control" required>
                <option value="">-- Select mode --</option>
                <option value="cash">Cash</option>
                <option value="online">Online</option>
            </select>
        </div>
        <div id="bank-field" class="mb-3 hidden-element">
            <label class="form-label">Bank/Wallet (for online payments)</label>
            <input type="text" name="bank" class="form-control" placeholder="e.g., HBL, JazzCash, etc.">
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-receipt-print="0">Create Payment</button>
        <button type="button" class="btn btn-success" data-receipt-print="1">Create Payment & Print</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modeSelect = document.getElementById('mode_select');
    const bankField = document.getElementById('bank-field');
    const paymentDateInput = document.getElementById('quick_payment_date');
    const paymentDateHidden = document.getElementById('quick_payment_date_hidden');

    function setDefaultPaymentDateTime() {
        if (!paymentDateInput || paymentDateInput.value) return;
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        paymentDateInput.value = `${day}/${month}/${year} ${hours}:${minutes}`;
        
        // Also set the hidden field with ISO format
        paymentDateHidden.value = `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function convertPaymentDateToISO() {
        if (paymentDateInput && paymentDateInput.value && paymentDateHidden) {
            const parts = paymentDateInput.value.match(/(\d{2})\/(\d{2})\/(\d{4})\s(\d{2}):(\d{2})/);
            if (parts) {
                const day = parts[1];
                const month = parts[2];
                const year = parts[3];
                const hours = parts[4];
                const minutes = parts[5];
                paymentDateHidden.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            }
        }
    }

    setDefaultPaymentDateTime();

    // Convert date whenever flatpickr changes it
    if (paymentDateInput) {
        paymentDateInput.addEventListener('change', convertPaymentDateToISO);
    }

    if (modeSelect) {
        modeSelect.addEventListener('change', function() {
            if (bankField) {
                bankField.style.display = this.value === 'online' ? 'block' : 'none';
            }
        });
    }

    const quickPaymentForm = document.getElementById('quickPaymentForm');
    
    if (quickPaymentForm) {
        quickPaymentForm.addEventListener('submit', function() {
            convertPaymentDateToISO();
        });
        
        setupAjaxReceiptForm(quickPaymentForm, {
            printField: document.getElementById('quickPaymentPrintReceipt'),
            onSuccess: function(data) {
                showToast(data.message || 'Payment has been recorded successfully.', 'success');
                const modalEl = document.getElementById('quickPaymentModal');
                if (modalEl) {
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    setTimeout(function() {
                        modal.hide();
                    }, 150);
                }
                quickPaymentForm.reset();
                setDefaultPaymentDateTime();
            },
            onError: function(error) {
                showToast(error.error || 'An error occurred while recording the payment.', 'danger');
            }
        });
    }
});
</script>
