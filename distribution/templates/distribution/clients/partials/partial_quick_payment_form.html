<form id="quickPaymentForm" method="post" action="{% url 'add_payment' %}">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Create Quick Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Client</label>
            <select name="client" id="client_select" class="form-control" required>
                <option value="">-- Select a client --</option>
                {% for client in clients %}
                <option value="{{ client.pk }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (PKR)</label>
            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Mode</label>
            <select name="mode" id="mode_select" class="form-control" required>
                <option value="">-- Select mode --</option>
                <option value="cash">Cash</option>
                <option value="online">Online</option>
            </select>
        </div>
        <div id="bank-field" class="mb-3 hidden-element">
            <label class="form-label">Bank/Wallet (for online payments)</label>
            <input type="text" name="bank" class="form-control" placeholder="e.g., HBL, JazzCash, etc.">
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Payment</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modeSelect = document.getElementById('mode_select');
    const bankField = document.getElementById('bank-field');

    if (modeSelect) {
        modeSelect.addEventListener('change', function() {
            if (bankField) {
                bankField.style.display = this.value === 'online' ? 'block' : 'none';
            }
        });
    }

    // Quick Payment Form Submission Handler
    const quickPaymentForm = document.getElementById('quickPaymentForm');
    
    if (quickPaymentForm) {
        quickPaymentForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-success alert-dismissible fade show';
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = `
                        <strong>✓ Success!</strong> Payment has been recorded successfully.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    
                    // Close the modal first
                    const modal = bootstrap.Modal.getInstance(document.getElementById('quickPaymentModal'));
                    if (modal) modal.hide();
                    
                    // Insert alert
                    const main = document.querySelector('main') || document.querySelector('.container');
                    if (main) {
                        main.insertBefore(alertDiv, main.firstChild);
                    }
                    
                    // Clear the form
                    quickPaymentForm.reset();
                    
                    // Auto-dismiss alert after 5 seconds
                    setTimeout(() => alertDiv.remove(), 5000);
                } else {
                    // Show error message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = `
                        <strong>Error!</strong> ${data.error || 'An error occurred while recording the payment.'}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    
                    const main = document.querySelector('main') || document.querySelector('.container');
                    if (main) {
                        main.insertBefore(alertDiv, main.firstChild);
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                alertDiv.role = 'alert';
                alertDiv.innerHTML = `
                    <strong>Error!</strong> An error occurred while recording the payment.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                
                const main = document.querySelector('main') || document.querySelector('.container');
                if (main) {
                    main.insertBefore(alertDiv, main.firstChild);
                }
            });
        });
    }
});
</script>
