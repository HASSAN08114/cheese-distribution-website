<form id="quickPaymentForm" method="post" action="{% url 'add_payment' %}">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Create Quick Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Client</label>
            <div class="input-group">
                <input type="text" id="clientSearch" class="form-control" placeholder="Type to search client...">
                <button class="btn btn-outline-secondary" type="button" id="clearClientSearch">Clear</button>
            </div>
            <select name="client" id="client_select" class="form-control mt-2" required>
                <option value="">-- Select a client --</option>
                {% for client in clients %}
                <option value="{{ client.pk }}" data-name="{{ client.name|lower }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Amount (PKR)</label>
            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Payment Mode</label>
            <select name="mode" id="mode_select" class="form-control" required>
                <option value="">-- Select mode --</option>
                <option value="cash">Cash</option>
                <option value="online">Online</option>
            </select>
        </div>
        <div id="bank-field" class="mb-3 hidden-element">
            <label class="form-label">Bank/Wallet (for online payments)</label>
            <input type="text" name="bank" class="form-control" placeholder="e.g., HBL, JazzCash, etc.">
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Create Payment</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modeSelect = document.getElementById('mode_select');
    const bankField = document.getElementById('bank-field');
    const clientSearch = document.getElementById('clientSearch');
    const clientSelect = document.getElementById('client_select');
    const clearBtn = document.getElementById('clearClientSearch');

    // Make client select searchable
    if (clientSearch && clientSelect) {
        clientSearch.addEventListener('input', function() {
            const searchValue = this.value.toLowerCase();
            const options = clientSelect.querySelectorAll('option:not(:first-child)');
            
            options.forEach(option => {
                const clientName = option.getAttribute('data-name');
                if (clientName.includes(searchValue) || searchValue === '') {
                    option.style.display = '';
                } else {
                    option.style.display = 'none';
                }
            });
        });
        
        clearBtn.addEventListener('click', function() {
            clientSearch.value = '';
            clientSelect.value = '';
            clientSelect.querySelectorAll('option').forEach(o => o.style.display = '');
        });
        
        // Auto-select when only one option is visible
        clientSelect.addEventListener('change', function() {
            if (this.value) {
                clientSearch.value = this.options[this.selectedIndex].textContent;
            }
        });
    }

    if (modeSelect) {
        modeSelect.addEventListener('change', function() {
            if (bankField) {
                bankField.style.display = this.value === 'online' ? 'block' : 'none';
            }
        });
    }

    // Quick Payment Form Submission Handler with deduplication
    const quickPaymentForm = document.getElementById('quickPaymentForm');
    
    if (quickPaymentForm) {
        setupAjaxForm(quickPaymentForm,
            function(data) {
                showToast(data.message || 'Payment has been recorded successfully.', 'success');
                const modal = bootstrap.Modal.getInstance(document.getElementById('quickPaymentModal'));
                if (modal) modal.hide();
                quickPaymentForm.reset();
                const clientSearch = document.getElementById('clientSearch');
                if (clientSearch) clientSearch.value = '';
            },
            function(error) {
                showToast(error.error || 'An error occurred while recording the payment.', 'danger');
            }
        );
    }
});
</script>
