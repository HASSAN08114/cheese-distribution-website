<div class="modal-header">
    <h5 class="modal-title"><i class="bi bi-pencil"></i> Edit Payment</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>

<form method="post" action="{% url 'payment_edit' payment.pk %}">
    {% csrf_token %}
    <div class="modal-body">
        {{ form.non_field_errors }}
        <div class="mb-3">
            <label class="form-label">{{ form.client.label }}</label>
            {{ form.client }}
            {{ form.client.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.amount.label }}</label>
            {{ form.amount }}
            {{ form.amount.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.date.label }} (DD/MM/YYYY HH:MM)</label>
            <input
                type="text"
                name="date"
                id="editPaymentDate"
                class="form-control js-datetime-picker"
                value="{% if form.is_bound %}{{ form.data.date }}{% else %}{{ payment.date|date:'d/m/Y H:i' }}{% endif %}"
                placeholder="DD/MM/YYYY HH:MM"
                required
            >
            {{ form.date.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label">{{ form.mode.label }}</label>
            {{ form.mode }}
            {{ form.mode.errors }}
        </div>
        <div id="edit-bank-field" class="mb-3 {% if form.instance.mode != 'online' %}hidden-element{% endif %}">
            <label class="form-label">{{ form.bank.label }}</label>
            {{ form.bank }}
            {{ form.bank.errors }}
            <small class="text-muted">Required for online payments.</small>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
</form>
