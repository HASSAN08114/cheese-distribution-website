<form id="addSaleForm" method="post" action="{% url 'quick_sale_create' %}">
    {% csrf_token %}
    <input type="hidden" name="print_receipt" id="addSalePrintReceipt" value="0">
    <div class="modal-header">
        <h5 class="modal-title">Add Sale</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <style>
        .price-auto-filled {
            color: #999 !important;
            font-style: italic;
        }
        .price-auto-filled::placeholder {
            color: #ccc;
        }
    </style>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Client</label>
            <select name="client" id="addSaleModalClient" class="form-control" required>
                <option value="">-- Select a client --</option>
                {% for client in clients %}
                <option value="{{ client.pk }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Sale Date & Time (Optional - DD/MM/YYYY HH:MM)</label>
            <input type="text" id="addSaleModalDateDisplay" class="form-control js-datetime-picker" placeholder="DD/MM/YYYY HH:MM" title="Leave empty to use current date and time">
            <input type="hidden" id="addSaleModalDate" name="sale_date">
            <small class="text-muted">Leave empty to use current date and time</small>
        </div>
        <h6 class="mt-4 mb-3">Sale Items</h6>
        {{ formset.management_form }}
        <div id="addSaleFormsetContainer">
            {% for form in formset %}
            <div class="row mb-3 formset-row border-bottom pb-3">
                {{ form.id }}
                <div class="col-md-5">
                    <label class="form-label">Product</label>
                    {{ form.cheese_product }}
                </div>
                <div class="col-md-2">
                    <label class="form-label">Packets</label>
                    {{ form.quantity_packets }}
                </div>
                <div class="col-md-3">
                    <label class="form-label">Packet Price</label>
                    {{ form.selling_price_per_packet }}
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-sm btn-danger remove-item w-100">Remove</button>
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="button" class="btn btn-secondary btn-sm" id="addSaleAddItemBtn"><i class="bi bi-plus-lg"></i> Add Item</button>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-receipt-print="0">Create Sale</button>
        <button type="button" class="btn btn-success" data-receipt-print="1">Create Sale & Print</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle Add Sale modal item addition/removal
    const addSaleAddItemBtn = document.getElementById('addSaleAddItemBtn');
    const addSaleContainer = document.getElementById('addSaleFormsetContainer');
    const totalForms = document.getElementById('id_form-TOTAL_FORMS');
    const clientSelect = document.getElementById('addSaleModalClient');
    
    if (!addSaleAddItemBtn || !addSaleContainer || !totalForms) return;
    
    let formCount = parseInt(totalForms.value);

    // Function to fetch and fill price based on client and product
    function fetchAndFillPrice(productSelect, priceInput) {
        const clientId = clientSelect.value;
        const productId = productSelect.value;
        
        if (!clientId || !productId) {
            priceInput.value = '';
            priceInput.classList.remove('price-auto-filled');
            return;
        }
        
        fetch(`/api/client-product-price/${clientId}/${productId}/`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    priceInput.value = data.price;
                    // Add visual indicator that this is an auto-filled price
                    priceInput.classList.add('price-auto-filled');
                    priceInput.title = 'Auto-suggested price (you can edit this)';
                }
            })
            .catch(error => {
                console.error('Error fetching price:', error);
            });
    }

    // Function to attach price-fill listeners to a row
    function attachPriceListeners(row) {
        const productSelect = row.querySelector('select[name*="cheese_product"]');
        const priceInput = row.querySelector('input[name*="selling_price_per_packet"]');
        
        if (productSelect && priceInput) {
            productSelect.addEventListener('change', function() {
                fetchAndFillPrice(productSelect, priceInput);
            });
            
            // Remove the grey styling when user focuses on the price field
            priceInput.addEventListener('focus', function() {
                priceInput.classList.remove('price-auto-filled');
                priceInput.title = '';
            });
            
            // Add back the styling if user clears the field
            priceInput.addEventListener('blur', function() {
                if (!priceInput.value) {
                    priceInput.classList.remove('price-auto-filled');
                }
            });
        }
    }

    // Attach listeners to existing rows
    addSaleContainer.querySelectorAll('.formset-row').forEach(row => {
        attachPriceListeners(row);
    });

    // When client changes, refetch prices for all rows with selected products
    if (clientSelect) {
        clientSelect.addEventListener('change', function() {
            addSaleContainer.querySelectorAll('.formset-row').forEach(row => {
                const productSelect = row.querySelector('select[name*="cheese_product"]');
                const priceInput = row.querySelector('input[name*="selling_price_per_packet"]');
                if (productSelect && productSelect.value && priceInput) {
                    fetchAndFillPrice(productSelect, priceInput);
                }
            });
        });
    }

    function updateRemoveButtons() {
        addSaleContainer.querySelectorAll('.remove-item').forEach(function(btn) {
            btn.onclick = function(e) {
                e.preventDefault();
                const row = btn.closest('.formset-row');
                if (addSaleContainer.querySelectorAll('.formset-row').length > 1) {
                    row.remove();
                    formCount--;
                    totalForms.value = formCount;
                } else {
                    showToast('Must have at least one item', 'warning');
                }
            };
        });
    }

    if (addSaleAddItemBtn) {
        addSaleAddItemBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const rows = addSaleContainer.querySelectorAll('.formset-row');
            const lastRow = rows[rows.length - 1];
            const newForm = lastRow.cloneNode(true);

            const formRegex = RegExp(`form-(\\d+)-`, 'g');
            newForm.innerHTML = newForm.innerHTML.replace(formRegex, function(match) {
                return match.replace(/\d+/, formCount);
            });

            const inputs = newForm.querySelectorAll('input, select');
            inputs.forEach(function(input) {
                if (input.name) {
                    input.name = input.name.replace(/\d+/, formCount);
                }
                if (input.id) {
                    input.id = input.id.replace(/\d+/, formCount);
                }
                if (input.type !== 'hidden' && input.type !== 'checkbox') {
                    input.value = '';
                }
                if (input.type === 'checkbox') {
                    input.checked = false;
                }
            });

            addSaleContainer.appendChild(newForm);
            formCount++;
            totalForms.value = formCount;
            updateRemoveButtons();
            // Attach price listeners to the new row
            attachPriceListeners(newForm);
        });
    }

    updateRemoveButtons();
});

// Populate current date/time when modal is shown
document.addEventListener('DOMContentLoaded', function() {
    const addSaleModal = document.getElementById('addSaleModal');
    if (addSaleModal) {
        addSaleModal.addEventListener('shown.bs.modal', function() {
            const saleDateDisplayInput = document.getElementById('addSaleModalDateDisplay');
            if (saleDateDisplayInput && !saleDateDisplayInput.value) {
                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                saleDateDisplayInput.value = `${day}/${month}/${year} ${hours}:${minutes}`;
            }
        });
    }
});

// Convert DD/MM/YYYY HH:MM to ISO format before form submission
document.addEventListener('DOMContentLoaded', function() {
    const addSaleForm = document.getElementById('addSaleForm');
    if (addSaleForm) {
        addSaleForm.addEventListener('submit', function(e) {
            const displayInput = document.getElementById('addSaleModalDateDisplay');
            const hiddenInput = document.getElementById('addSaleModalDate');
            
            if (displayInput && displayInput.value) {
                const match = displayInput.value.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
                if (match) {
                    const day = match[1];
                    const month = match[2];
                    const year = match[3];
                    const hours = match[4];
                    const minutes = match[5];
                    hiddenInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                }
            }
        });

        setupAjaxReceiptForm(addSaleForm, {
            printField: document.getElementById('addSalePrintReceipt'),
            onSuccess: function(data) {
                showToast(data.message || 'Sale created successfully.', 'success');
                const modalEl = document.getElementById('addSaleModal');
                if (modalEl) {
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    setTimeout(function() {
                        modal.hide();
                    }, 150);
                }
                addSaleForm.reset();
            },
            onError: function(error) {
                showToast(error.error || 'Unable to create sale.', 'danger');
            }
        });
    }
});
</script>
