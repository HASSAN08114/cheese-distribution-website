<form id="quickSaleForm" method="post" action="{% url 'quick_sale_create' %}">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Create Quick Sale</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label for="client" class="form-label">Client</label>
            <select name="client" id="client" class="form-control" required>
                <option value="">Select a client</option>
                {% for client in clients %}
                <option value="{{ client.pk }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="sale_date" class="form-label">Sale Date & Time (Optional)</label>
            <input type="datetime-local" name="sale_date" id="sale_date" class="form-control" title="Leave empty to use current date and time">
            <small class="text-muted">Leave empty to use current date and time</small>
        </div>

        <h6 class="mt-4 mb-3">Sale Items</h6>
        {{ formset.management_form }}
        <div id="formset-container">
            {% for form in formset %}
            <div class="row mb-3 formset-row border-bottom pb-3">
                {{ form.id }}
                <div class="col-md-4">
                    <label class="form-label">Cheese Product</label>
                    {{ form.cheese_product }}
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quantity (Packets)</label>
                    {{ form.quantity_packets }}
                </div>
                <div class="col-md-3">
                    <label class="form-label">Selling Price (PKR/Packet)</label>
                    {{ form.selling_price_per_packet }}
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="button" class="btn btn-sm" id="remove-item">Remove</button>
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="button" class="btn btn-sm" id="add-item">Add Item</button>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn">Create Sale</button>
    </div>
</form>
