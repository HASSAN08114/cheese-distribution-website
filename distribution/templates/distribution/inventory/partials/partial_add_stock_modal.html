<form method="post" action="{% url 'add_stock_quantity' %}" id="addStockForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" id="addStockProductId" required>
    <div class="mb-3">
        <label class="form-label">Product</label>
        <div class="stock-product-display stock-product-display-add">
            <div id="addStockProductName">-</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Quantity to Add (Packets)</label>
        <input type="number" name="quantity" class="form-control" step="1" min="1" required>
    </div>
</form>
