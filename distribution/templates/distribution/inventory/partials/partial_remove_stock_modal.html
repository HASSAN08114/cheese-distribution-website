<form method="post" action="{% url 'remove_stock_quantity' %}" id="removeStockForm">
    {% csrf_token %}
    <input type="hidden" name="product_id" id="removeStockProductId" required>
    <div class="mb-3">
        <label class="form-label">Product</label>
        <div class="stock-product-display stock-product-display-remove">
            <div id="removeStockProductName">-</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Quantity to Remove (Packets)</label>
        <input type="number" name="quantity" class="form-control" min="1" step="1" required>
    </div>
</form>
