<form id="cheeseTypeForm" method="post" action="{% url 'cheese_type_add' %}">
    {% csrf_token %}
    <div class="mb-3">
        <label for="{{ cheese_type_form.name.id_for_label }}" class="form-label">Type Name</label>
        {{ cheese_type_form.name }}
        {% if cheese_type_form.name.errors %}
            <div class="text-danger">{{ cheese_type_form.name.errors }}</div>
        {% endif %}
    </div>
</form>
