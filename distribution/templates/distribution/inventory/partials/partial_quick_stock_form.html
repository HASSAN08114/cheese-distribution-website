<form id="quickStockForm" method="post" action="{% url 'add_stock' %}">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Add Stock</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label class="form-label">Select Product</label>
            <select name="cheese_product" id="product_select" class="form-control" required>
                <option value="">-- Select a product --</option>
                {% for item in products_with_value %}
                <option value="{{ item.product.pk }}">{{ item.product.manufacturer.name }} - {{ item.product.type.name }} ({{ item.product.packet_size }}KG)</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity to Add (Packets)</label>
            <input type="number" name="quantity_packets" class="form-control" step="0.01" min="0.01" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Purchase Price (PKR/Packet)</label>
            <input type="number" name="purchase_price_per_packet" class="form-control" step="0.01" min="0.01" required>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Stock</button>
    </div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const quickStockForm = document.getElementById('quickStockForm');
    
    if (quickStockForm) {
        quickStockForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Show success message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-success alert-dismissible fade show';
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = `
                        <strong>✓ Success!</strong> Stock has been added successfully.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    
                    // Close the modal first
                    const modal = bootstrap.Modal.getInstance(document.getElementById('quickStockModal'));
                    if (modal) modal.hide();
                    
                    // Insert alert
                    const main = document.querySelector('main') || document.querySelector('.container');
                    if (main) {
                        main.insertBefore(alertDiv, main.firstChild);
                    }
                    
                    // Clear the form
                    quickStockForm.reset();
                    
                    // Auto-dismiss alert after 5 seconds
                    setTimeout(() => alertDiv.remove(), 5000);
                } else {
                    // Show error message
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = `
                        <strong>Error!</strong> ${data.error || 'An error occurred while adding stock.'}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;
                    
                    const main = document.querySelector('main') || document.querySelector('.container');
                    if (main) {
                        main.insertBefore(alertDiv, main.firstChild);
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const alertDiv = document.createElement('div');
                alertDiv.className = 'alert alert-danger alert-dismissible fade show';
                alertDiv.role = 'alert';
                alertDiv.innerHTML = `
                    <strong>Error!</strong> An error occurred while adding stock.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                
                const main = document.querySelector('main') || document.querySelector('.container');
                if (main) {
                    main.insertBefore(alertDiv, main.firstChild);
                }
            });
        });
    }
});
</script>
